<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>単語テストメーカー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=JetBrains+Mono:wght@400;600&family=Klee+One:wght@600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  :root{
    --paper:#FAF7F0;
    --paper-line:#D8D3C5;
    --ink:#1B2A4A;
    --ink-soft:#455170;
    --red:#C8372E;
    --graphite:#57554C;
    --panel:#EFEAE0;
    --shadow: rgba(27,42,74,0.18);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:#DCD6C6;
    color:var(--ink);
    font-family:'Zen Kaku Gothic New', sans-serif;
    min-height:100vh;
  }
  .app{
    display:grid;
    grid-template-columns: 340px 1fr;
    gap:0;
    min-height:100vh;
  }
  /* -------- LEFT CONFIG PANEL -------- */
  .config{
    background:var(--panel);
    padding:28px 24px 40px;
    border-right:1px solid #cfc8b6;
  }
  .eyebrow{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    letter-spacing:.18em;
    color:var(--red);
    font-weight:600;
  }
  h1{
    font-family:'Shippori Mincho', serif;
    font-size:26px;
    margin:6px 0 24px;
    font-weight:700;
    line-height:1.3;
  }
  .field{margin-bottom:18px;}
  .field label{
    display:block;
    font-size:12px;
    font-weight:700;
    color:var(--ink-soft);
    margin-bottom:6px;
    letter-spacing:.02em;
  }
  .field input[type=text], .field input[type=number], .field select, .field textarea{
    width:100%;
    border:1px solid #c6bfa9;
    background:#fff;
    border-radius:2px;
    padding:9px 10px;
    font-family:'Zen Kaku Gothic New', sans-serif;
    font-size:14px;
    color:var(--ink);
  }
  .field textarea{resize:vertical;min-height:70px;font-family:'JetBrains Mono',monospace;font-size:12px;}
  .dropzone{
    border:1.5px dashed #A9A18A;
    border-radius:3px;
    padding:18px 14px;
    text-align:center;
    font-size:13px;
    color:var(--graphite);
    cursor:pointer;
    background:#fff;
    transition:border-color .15s, background .15s;
  }
  .dropzone.drag{border-color:var(--red); background:#fdf3f2;}
  .dropzone strong{color:var(--ink);}
  .dropzone input{display:none;}
  .filename{
    margin-top:8px;
    font-family:'JetBrains Mono',monospace;
    font-size:11.5px;
    color:var(--red);
    word-break:break-all;
  }
  .radiogroup{display:flex;flex-direction:column;gap:6px;}
  .radiogroup label{
    display:flex;align-items:center;gap:8px;
    font-size:13.5px;font-weight:500;color:var(--ink);
    cursor:pointer;
  }
  .checkline{display:flex;align-items:center;gap:8px;font-size:13.5px;margin-top:4px;cursor:pointer;}
  .btn{
    width:100%;
    padding:12px;
    border:none;
    border-radius:2px;
    font-family:'Zen Kaku Gothic New', sans-serif;
    font-size:14.5px;
    font-weight:700;
    cursor:pointer;
    letter-spacing:.02em;
  }
  .btn-primary{
    background:var(--ink);
    color:var(--paper);
    margin-top:8px;
  }
  .btn-primary:hover{background:var(--ink-soft);}
  .status{
    margin-top:14px;
    font-size:12px;
    color:var(--graphite);
    line-height:1.6;
    min-height:16px;
  }
  .status.err{color:var(--red);font-weight:700;}

  /* -------- RIGHT PREVIEW -------- */
  .previewzone{
    padding:28px 40px 60px;
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  .toolbar{
    width:100%;
    max-width:760px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
  }
  .tabs{display:flex;gap:2px;background:#cfc8b6;padding:3px;border-radius:3px;}
  .tabs button{
    border:none;background:transparent;padding:8px 18px;
    font-family:'Zen Kaku Gothic New';font-size:13px;font-weight:700;
    color:var(--graphite);cursor:pointer;border-radius:2px;
  }
  .tabs button.active{background:var(--paper);color:var(--ink);}
  .printbtn{
    background:var(--red);color:#fff;border:none;padding:10px 20px;
    font-weight:700;font-size:13.5px;border-radius:2px;cursor:pointer;
    font-family:'Zen Kaku Gothic New';
  }
  .printbtn:hover{background:#a92c24;}

  .paper{
    width:100%;
    max-width:760px;
    min-height:1000px;
    background:var(--paper);
    box-shadow:0 8px 28px var(--shadow);
    padding:56px 60px 60px;
    position:relative;
    display:none;
  }
  .paper.show{display:block;}
  .paper::before{
    content:"";
    position:absolute;top:0;left:44px;bottom:0;width:1px;
    background:var(--paper-line);
  }
  .sheet-head{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    border-bottom:2px solid var(--ink);
    padding-bottom:10px;
    margin-bottom:8px;
  }
  .sheet-head h2{
    font-family:'Shippori Mincho', serif;
    font-size:24px;
    margin:0;
  }
  .sheet-meta{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    color:var(--graphite);
    text-align:right;
    line-height:1.7;
  }
  .sheet-sub{
    display:flex;justify-content:space-between;
    font-size:11.5px;color:var(--graphite);
    margin-bottom:26px;
    font-family:'JetBrains Mono', monospace;
  }
  .qlist{list-style:none;margin:0;padding:0;}
  .qlist li{
    display:flex;
    align-items:baseline;
    gap:10px;
    padding:13px 0;
    border-bottom:1px solid var(--paper-line);
  }
  .qnum{
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    color:var(--red);
    width:22px;
    flex-shrink:0;
  }
  .qprompt{
    font-size:15.5px;
    font-weight:500;
    width:230px;
    flex-shrink:0;
  }
  .qprompt .tag{
    font-family:'JetBrains Mono',monospace;
    font-size:9.5px;
    color:var(--graphite);
    display:block;
    letter-spacing:.05em;
    margin-bottom:1px;
  }
  .qblank{
    flex:1;
    border-bottom:1px solid var(--ink);
    height:20px;
  }
  .ans-text{
    font-family:'Klee One', cursive;
    color:var(--red);
    font-size:16.5px;
    font-weight:600;
  }
  .empty-note{
    color:var(--graphite);
    font-size:14px;
    padding:40px 0;
    text-align:center;
    line-height:1.8;
  }

  @media print{
    body{background:#fff;}
    .config, .toolbar{display:none !important;}
    .app{display:block;}
    .previewzone{padding:0;}
    .paper{
      display:none;
      box-shadow:none;
      max-width:none;
      width:auto;
      padding:14mm 16mm;
      min-height:0;
    }
    .paper.print-include{display:block;}
    .paper.print-include + .paper.print-include{
      page-break-before:always;
    }
  }
</style>
</head>
<body>
<div class="app">

  <!-- ===== LEFT CONFIG ===== -->
  <div class="config">
    <div class="eyebrow">VOCAB DRILL PRINTER</div>
    <h1>単語・熟語<br>テストメーカー</h1>

    <div class="field">
      <label>① 単語リスト(CSV)</label>
      <div class="dropzone" id="dropzone">
        <div>ここにCSVをドラッグ&ドロップ<br>または<strong>クリックして選択</strong></div>
        <input type="file" id="fileInput" accept=".csv,text/csv">
      </div>
      <div class="filename" id="filename"></div>
    </div>

    <div class="field">
      <label>形式の例(1行目はヘッダーでもOK)</label>
      <textarea readonly rows="3">word,meaning
apple,りんご
give up,あきらめる</textarea>
    </div>

    <div class="field" id="driveField">
      <label>または Googleドライブから取得(固定ファイル)</label>
      <input type="text" id="gClientId" placeholder="OAuthクライアントID">
      <input type="text" id="gFileId" placeholder="ファイルID(共有リンクの/d/と/edit の間)" style="margin-top:6px;">
      <button class="btn" id="gLoginBtn" style="margin-top:8px;background:#fff;border:1px solid #c6bfa9;color:var(--ink);">🔗 Googleでログインして最新版を取得</button>
      <div class="status" id="gStatus"></div>
    </div>

    <div class="field">
      <label>② テストタイトル</label>
      <input type="text" id="titleInput" value="英単語・熟語テスト">
    </div>

    <div class="field">
      <label>③ 出題形式</label>
      <div class="radiogroup">
        <label><input type="radio" name="dir" value="en-ja" checked> 英語 → 日本語(意味を書く)</label>
        <label><input type="radio" name="dir" value="ja-en"> 日本語 → 英語(つづりを書く)</label>
        <label><input type="radio" name="dir" value="mix"> ランダムに混ぜる</label>
      </div>
    </div>

    <div class="field" id="mixField" style="display:none;">
      <label>混在の内訳(日→英の問題数)</label>
      <input type="number" id="mixJaEnInput" value="0" min="0">
      <div style="font-size:11.5px;color:var(--graphite);margin-top:5px;">
        残りは自動的に英→日になります。出題数以上を指定すると全問が日→英になります。日→英 → 英→日の順でまとめて出題されます。
      </div>
    </div>

    <div class="field">
      <label>④ 出題数(0で全問)</label>
      <input type="number" id="countInput" value="0" min="0">
    </div>

    <label class="checkline"><input type="checkbox" id="shuffleCheck" checked> 出題順をシャッフルする</label>
    <label class="checkline"><input type="checkbox" id="answerCheck" checked> 解答用紙も一緒に印刷する</label>

    <button class="btn btn-primary" id="genBtn">テストを作成する</button>
    <div class="status" id="status">CSVをアップロードすると作成できます。</div>
  </div>

  <!-- ===== RIGHT PREVIEW ===== -->
  <div class="previewzone">
    <div class="toolbar">
      <div class="tabs">
        <button id="tabTest" class="active">テスト用紙</button>
        <button id="tabAns">解答用紙</button>
      </div>
      <button class="printbtn" id="printBtn">🖨 印刷 / PDF保存</button>
    </div>

    <div class="paper show" id="paperTest">
      <div class="empty-note">左のパネルからCSVをアップロードして<br>「テストを作成する」を押してください。</div>
    </div>
    <div class="paper" id="paperAns"></div>
  </div>

</div>

<script>
let words = []; // {word, meaning}

const dropzone = document.getElementById('dropzone');
const fileInput = document.getElementById('fileInput');
const filenameEl = document.getElementById('filename');
const statusEl = document.getElementById('status');

dropzone.addEventListener('click', () => fileInput.click());
dropzone.addEventListener('dragover', e => { e.preventDefault(); dropzone.classList.add('drag'); });
dropzone.addEventListener('dragleave', () => dropzone.classList.remove('drag'));
dropzone.addEventListener('drop', e => {
  e.preventDefault();
  dropzone.classList.remove('drag');
  if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
});
fileInput.addEventListener('change', e => {
  if (e.target.files.length) handleFile(e.target.files[0]);
});

function decodeBestEffort(buffer){
  // まずUTF-8として読み、置換文字(文字化けの目印)が多ければShift-JISとして読み直す
  const utf8Text = new TextDecoder('utf-8').decode(buffer);
  const badRatio = (utf8Text.match(/\uFFFD/g) || []).length / Math.max(utf8Text.length, 1);
  if (badRatio > 0.005) {
    try {
      return { text: new TextDecoder('shift_jis').decode(buffer), enc: 'Shift-JIS' };
    } catch (e) {
      return { text: utf8Text, enc: 'UTF-8' };
    }
  }
  return { text: utf8Text, enc: 'UTF-8' };
}

function processCsvBuffer(buffer, sourceLabel){
  const { text, enc } = decodeBestEffort(buffer);
  Papa.parse(text, {
    complete: function(results){
      const rows = results.data.filter(r => r.length >= 2 && (r[0]||'').trim() !== '');
      let parsed = rows.map(r => ({ word: (r[0]||'').trim(), meaning: (r[1]||'').trim() }));
      // ヘッダー行らしきものを除去
      if (parsed.length && /^(word|英単語|単語|english)$/i.test(parsed[0].word)) {
        parsed = parsed.slice(1);
      }
      parsed = parsed.filter(p => p.word && p.meaning);
      if (!parsed.length){
        statusEl.textContent = 'CSVから単語を読み取れませんでした。「単語,意味」の2列形式か確認してください。';
        statusEl.classList.add('err');
        filenameEl.textContent = '';
        return;
      }
      words = parsed;
      filenameEl.textContent = '✓ ' + sourceLabel + '(' + words.length + '語 / ' + enc + ')';
      statusEl.classList.remove('err');
      statusEl.textContent = words.length + '語 読み込みました。設定を確認して「テストを作成する」を押してください。';
    },
    error: function(err){
      statusEl.classList.add('err');
      statusEl.textContent = '読み込みエラー: ' + err.message;
    }
  });
}

function handleFile(file){
  filenameEl.textContent = '読み込み中: ' + file.name;
  const reader = new FileReader();
  reader.onload = function(e){ processCsvBuffer(e.target.result, file.name); };
  reader.onerror = function(){
    statusEl.classList.add('err');
    statusEl.textContent = 'ファイルの読み込みに失敗しました。';
  };
  reader.readAsArrayBuffer(file);
}

/* ---------- Googleドライブ連携 ---------- */
const CLIENT_ID_KEY = 'vocabDrive_clientId';
const FILE_ID_KEY = 'vocabDrive_fileId';
const gClientIdInput = document.getElementById('gClientId');
const gFileIdInput = document.getElementById('gFileId');
const gStatus = document.getElementById('gStatus');
gClientIdInput.value = localStorage.getItem(CLIENT_ID_KEY) || '';
gFileIdInput.value = localStorage.getItem(FILE_ID_KEY) || '';

let tokenClient = null;
let accessToken = null;

function ensureTokenClient(clientId){
  if (!window.google || !google.accounts || !google.accounts.oauth2) {
    gStatus.classList.add('err');
    gStatus.textContent = 'Googleライブラリの読み込み待ちです。少し待って再度お試しください。';
    return null;
  }
  if (!tokenClient || tokenClient.__clientId !== clientId) {
    tokenClient = google.accounts.oauth2.initTokenClient({
      client_id: clientId,
      scope: 'https://www.googleapis.com/auth/drive.readonly',
      callback: (resp) => {
        if (resp.error) {
          gStatus.classList.add('err');
          gStatus.textContent = '認証エラー: ' + resp.error;
          return;
        }
        accessToken = resp.access_token;
        fetchDriveFile();
      }
    });
    tokenClient.__clientId = clientId;
  }
  return tokenClient;
}

async function fetchDriveFile(){
  const fileId = gFileIdInput.value.trim();
  gStatus.classList.remove('err');
  gStatus.textContent = 'ドライブから取得中…';
  try {
    const res = await fetch(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`, {
      headers: { Authorization: 'Bearer ' + accessToken }
    });
    if (!res.ok) throw new Error('HTTP ' + res.status + '(ファイルIDまたはアクセス権限を確認してください)');
    const buffer = await res.arrayBuffer();
    processCsvBuffer(buffer, 'Google Drive');
    gStatus.textContent = '✓ ドライブから取得・反映しました。';
  } catch (err) {
    gStatus.classList.add('err');
    gStatus.textContent = '取得エラー: ' + err.message;
  }
}

document.getElementById('gLoginBtn').addEventListener('click', () => {
  gStatus.classList.remove('err');
  const clientId = gClientIdInput.value.trim();
  const fileId = gFileIdInput.value.trim();
  if (!clientId){ gStatus.classList.add('err'); gStatus.textContent = 'クライアントIDを入力してください。'; return; }
  if (!fileId){ gStatus.classList.add('err'); gStatus.textContent = 'ファイルIDを入力してください。'; return; }
  localStorage.setItem(CLIENT_ID_KEY, clientId);
  localStorage.setItem(FILE_ID_KEY, fileId);
  const tc = ensureTokenClient(clientId);
  if (!tc) return;
  gStatus.textContent = 'Googleの認証画面を開いています…';
  tc.requestAccessToken({ prompt: accessToken ? '' : 'consent' });
});

function shuffle(arr){
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i+1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

const mixField = document.getElementById('mixField');
document.querySelectorAll('input[name=dir]').forEach(r => {
  r.addEventListener('change', () => {
    mixField.style.display = (document.querySelector('input[name=dir]:checked').value === 'mix') ? 'block' : 'none';
  });
});


document.getElementById('genBtn').addEventListener('click', () => {
  if (!words.length){
    statusEl.classList.add('err');
    statusEl.textContent = '先にCSVをアップロードしてください。';
    return;
  }
  statusEl.classList.remove('err');

  const title = document.getElementById('titleInput').value.trim() || '英単語・熟語テスト';
  const dir = document.querySelector('input[name=dir]:checked').value;
  let count = parseInt(document.getElementById('countInput').value, 10);
  const doShuffle = document.getElementById('shuffleCheck').checked;

  let pool = doShuffle ? shuffle(words) : words.slice();
  if (!count || count <= 0 || count > pool.length) count = pool.length;
  pool = pool.slice(0, count);

  let questions;
  if (dir === 'mix') {
    let jaEnCount = parseInt(document.getElementById('mixJaEnInput').value, 10);
    if (isNaN(jaEnCount) || jaEnCount < 0) jaEnCount = 0;
    if (jaEnCount > pool.length) jaEnCount = pool.length;
    const dirs = [ ...Array(jaEnCount).fill('ja-en'), ...Array(pool.length - jaEnCount).fill('en-ja') ];
    questions = pool.map((w, i) => ({ ...w, qdir: dirs[i] }));
  } else {
    questions = pool.map(w => ({ ...w, qdir: dir }));
  }

  renderTest(title, questions);
  renderAnswers(title, questions);

  document.getElementById('paperTest').classList.add('print-include');
  document.getElementById('paperAns').classList.toggle('print-include', document.getElementById('answerCheck').checked);

  statusEl.textContent = questions.length + '問のテストを作成しました。';
});

function todayStr(){
  const d = new Date();
  return d.getFullYear() + '/' + String(d.getMonth()+1).padStart(2,'0') + '/' + String(d.getDate()).padStart(2,'0');
}

function renderTest(title, questions){
  const el = document.getElementById('paperTest');
  el.innerHTML = `
    <div class="sheet-head">
      <h2>${escapeHtml(title)}</h2>
      <div class="sheet-meta">DATE: ____ / ____<br>SCORE: ___ / ${questions.length}</div>
    </div>
    <div class="sheet-sub"><span>NAME: _______________________</span><span>${questions.length} QUESTIONS</span></div>
    <ol class="qlist">
      ${questions.map((q,i) => `
        <li>
          <span class="qnum">${String(i+1).padStart(2,'0')}</span>
          <span class="qprompt">
            <span class="tag">${q.qdir === 'en-ja' ? 'EN → JA' : 'JA → EN'}</span>
            ${escapeHtml(q.qdir === 'en-ja' ? q.word : q.meaning)}
          </span>
          <span class="qblank"></span>
        </li>
      `).join('')}
    </ol>
  `;
}

function renderAnswers(title, questions){
  const el = document.getElementById('paperAns');
  el.innerHTML = `
    <div class="sheet-head">
      <h2>${escapeHtml(title)} — 解答</h2>
      <div class="sheet-meta">GENERATED: ${todayStr()}</div>
    </div>
    <div class="sheet-sub"><span>ANSWER KEY</span><span>${questions.length} QUESTIONS</span></div>
    <ol class="qlist">
      ${questions.map((q,i) => `
        <li>
          <span class="qnum">${String(i+1).padStart(2,'0')}</span>
          <span class="qprompt">
            <span class="tag">${q.qdir === 'en-ja' ? 'EN → JA' : 'JA → EN'}</span>
            ${escapeHtml(q.qdir === 'en-ja' ? q.word : q.meaning)}
          </span>
          <span class="ans-text">${escapeHtml(q.qdir === 'en-ja' ? q.meaning : q.word)}</span>
        </li>
      `).join('')}
    </ol>
  `;
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

// タブ切り替え
const tabTest = document.getElementById('tabTest');
const tabAns = document.getElementById('tabAns');
const paperTest = document.getElementById('paperTest');
const paperAns = document.getElementById('paperAns');

tabTest.addEventListener('click', () => {
  tabTest.classList.add('active'); tabAns.classList.remove('active');
  paperTest.classList.add('show'); paperAns.classList.remove('show');
});
tabAns.addEventListener('click', () => {
  tabAns.classList.add('active'); tabTest.classList.remove('active');
  paperAns.classList.add('show'); paperTest.classList.remove('show');
});

document.getElementById('printBtn').addEventListener('click', () => window.print());
</script>
</body>
</html>
